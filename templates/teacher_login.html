{% extends 'base.html' %}
{% block title %}教师登录{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
  <div class="card p-4 shadow-lg" style="min-width:350px;max-width:400px;">
    <div class="text-center mb-3">
      <i class="fas fa-chalkboard-teacher fa-3x text-primary mb-2"></i>
      <h2>教师登录</h2>
    </div>
    <form method="post">
      <div class="form-group mb-3">
        <label>用户名</label>
        <input type="text" name="username" class="form-control rounded-pill" required autofocus>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="readonlyMode"
               name="mode" value="readonly"
               {% if readonly_enabled %}checked{% endif %}
               {% if not readonly_enabled %}disabled{% endif %}>
        <label class="form-check-label" for="readonlyMode">只读模式（仅课堂使用）</label>
        <div class="small text-muted">
          {% if readonly_enabled %}只读模式使用管理员设置的访问码，无需个人密码{% else %}管理员尚未配置教师只读访问码{% endif %}
        </div>
      </div>
      <div class="form-group mb-3" id="passwordGroup">
        <label>密码</label>
        <input type="password" name="password" id="teacherPassword" class="form-control rounded-pill" required>
      </div>
      <div class="form-group mb-3" id="readonlyCodeGroup" style="display:none;">
        <label>只读访问码</label>
        <input type="password" name="readonly_code" id="readonlyCode" class="form-control rounded-pill">
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill">登录</button>
    </form>
    <script>
      // 密码校验（PBKDF2）约需 0.5s：提交后立即给出反馈并防重复提交
      document.querySelector('form').addEventListener('submit', function () {
        var button = this.querySelector('button[type=submit]');
        if (!button) return;
        button.disabled = true;
        button.textContent = '登录中…';
      });
    </script>
    <script>
      (function () {
        var mode = document.getElementById('readonlyMode');
        if (!mode) return;
        var pw = document.getElementById('passwordGroup');
        var code = document.getElementById('readonlyCodeGroup');
        var pwInput = document.getElementById('teacherPassword');
        var codeInput = document.getElementById('readonlyCode');
        function sync() {
          var ro = mode.checked;
          pw.style.display = ro ? 'none' : '';
          code.style.display = ro ? '' : 'none';
          pwInput.required = !ro;
          codeInput.required = ro;
          if (!ro) codeInput.value = '';
        }
        mode.addEventListener('change', sync);
        sync();
      })();
    </script>
    <div class="mt-3 small text-muted text-center">
      编辑模式需密码；只读模式只能进入课堂使用资源
    </div>
  </div>
</div>
{% endblock %}

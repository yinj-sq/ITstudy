{% extends 'base.html' %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
  <div class="card p-4 shadow-lg" style="min-width:350px;max-width:400px;">
    <div class="text-center mb-3">
      <i class="fas fa-user-cog fa-3x text-primary mb-2"></i>
      <h2>管理员登录</h2>
    </div>
    <form method="post">
      <div class="form-group mb-3">
        <label>用户名</label>
        <input type="text" name="username" class="form-control rounded-pill" required>
      </div>
      <div class="form-group mb-3">
        <label>密码</label>
        <input type="password" name="password" class="form-control rounded-pill" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 rounded-pill">登录</button>
    </form>
    <script>
      // 密码校验（PBKDF2）约需 0.5s：提交后立即给出反馈并防重复提交
      document.querySelector('form').addEventListener('submit', function () {
        var button = this.querySelector('button[type=submit]');
        if (!button) return;
        button.disabled = true;
        button.textContent = '登录中…';
      });
    </script>
  </div>
</div>
{% endblock %}

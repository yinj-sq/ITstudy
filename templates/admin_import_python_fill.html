{% extends 'base.html' %}
{% block title %}批量导入Python填空题{% endblock %}
{% block content %}
<div class="container-fluid" style="max-width:1100px;margin-top:60px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-primary mb-0"><i class="fas fa-file-import me-2"></i>批量导入 Python 填空题</h4>
        <a href="/admin/questions" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>返回题库管理
        </a>
    </div>

    <!-- 流程说明 -->
    <div class="card mb-3">
        <div class="card-body py-3">
            <div class="row text-center g-3">
                <div class="col-md-4">
                    <span class="badge bg-primary rounded-circle me-1">1</span>
                    用<b>识别预览工具</b>（tools/python_fill_import_preview.html）
                    粘贴试题/答案、选 zip，逐题校对字段
                </div>
                <div class="col-md-4">
                    <span class="badge bg-primary rounded-circle me-1">2</span>
                    点「导出校对结果 JSON」得到
                    <code>python_fill_review.json</code>（含试卷拆分配置）
                </div>
                <div class="col-md-4">
                    <span class="badge bg-primary rounded-circle me-1">3</span>
                    在本页上传 JSON + 原 zip，点「开始导入」自动分卷建卷
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <!-- 上传区 -->
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">① 校对结果 JSON <span class="text-muted small">（python_fill_review.json）</span></label>
                    <input type="file" id="reviewFile" class="form-control" accept=".json">
                    <div class="form-text" id="reviewStatus">尚未选择</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">② 试题 zip <span class="text-muted small">（含各题 .py 模板）</span></label>
                    <input type="file" id="zipFile" class="form-control" accept=".zip">
                    <div class="form-text" id="zipStatus">尚未选择</div>
                </div>
            </div>

            <!-- split 配置（JSON 自动带出，可修改覆盖） -->
            <div class="row g-3 mt-1 align-items-end" id="splitBox" style="display:none;">
                <div class="col-md-2">
                    <label class="form-label fw-bold">每卷题数</label>
                    <input type="number" id="splitPerVolume" class="form-control" min="1" value="10">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold">考试时长（分钟）</label>
                    <input type="number" id="splitDuration" class="form-control" min="1" value="40">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">卷名前缀</label>
                    <input type="text" id="splitPrefix" class="form-control" value="Python填空题">
                </div>
                <div class="col-md-4">
                    <div class="form-text text-muted" id="splitPreview"></div>
                </div>
            </div>

            <!-- 预览题目数 -->
            <div class="mt-3" id="qCountBox" style="display:none;">
                <span class="badge bg-info text-dark" id="qCount"></span>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-primary" id="btnImport" onclick="doImport()">
                    <i class="fas fa-upload me-1"></i>开始导入
                </button>
                <button class="btn btn-outline-secondary" onclick="clearAll()">清空</button>
            </div>
        </div>
    </div>

    <!-- 导入报告 -->
    <div class="card mt-3" id="reportCard" style="display:none;">
        <div class="card-header fw-bold" id="reportTitle"></div>
        <div class="card-body" id="reportBody"></div>
    </div>
</div>

<script>
function getCSRF() {
    var m = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
}

var __reviewTotal = 0;  // 当前 JSON 的题目总数（分卷预览用）

/* 选择 JSON：读取 split 配置与题目数 */
document.getElementById('reviewFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    var st = document.getElementById('reviewStatus');
    if (!file) { st.textContent = '尚未选择'; return; }
    st.textContent = '已选择：' + file.name;
    var reader = new FileReader();
    reader.onload = function () {
        try {
            var data = JSON.parse(reader.result);
            if (!data || !Array.isArray(data.questions)) throw new Error('格式不符');
            document.getElementById('splitBox').style.display = 'flex';
            document.getElementById('qCountBox').style.display = '';
            __reviewTotal = data.questions.length;
            document.getElementById('qCount').textContent = '识别题目：' + data.questions.length + ' 题';
            if (data.split) {
                if (data.split.per_volume) document.getElementById('splitPerVolume').value = data.split.per_volume;
                if (data.split.duration) document.getElementById('splitDuration').value = data.split.duration;
                if (data.split.prefix) document.getElementById('splitPrefix').value = data.split.prefix;
            }
            previewSplit(data.questions.length);
        } catch (err) {
            st.textContent = 'JSON 解析失败：' + err.message + '（请确认是预览工具导出的 python_fill_review.json）';
            st.style.color = '#dc3545';
        }
    };
    reader.readAsText(file);
});

document.getElementById('zipFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    document.getElementById('zipStatus').textContent = file ? '已选择：' + file.name : '尚未选择';
});

/* 分卷预览（每卷 N 题，最后剩余组成一卷） */
function previewSplit(total) {
    var per = parseInt(document.getElementById('splitPerVolume').value, 10) || 10;
    var duration = parseInt(document.getElementById('splitDuration').value, 10) || 40;
    var prefix = (document.getElementById('splitPrefix').value || 'Python填空题').trim();
    var parts = [];
    for (var start = 1; start <= total; start += per) {
        var end = Math.min(start + per - 1, total);
        var vol = Math.floor((start - 1) / per) + 1;
        parts.push(prefix + ' 第' + vol + '卷（第' + start + '-' + end + '题，' + duration + '分钟）');
    }
    document.getElementById('splitPreview').textContent = '分卷：' + (parts.join('；') || '（无）');
}

document.getElementById('splitPerVolume').addEventListener('input', function () {
    previewSplit(__reviewTotal);
});

function doImport() {
    var review = document.getElementById('reviewFile').files[0];
    var zip = document.getElementById('zipFile').files[0];
    if (!review || !zip) {
        alert('请先选择校对结果 JSON 和试题 zip 两个文件');
        return;
    }
    var btn = document.getElementById('btnImport');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>导入中…';
    var fd = new FormData();
    fd.append('review_json', review);
    fd.append('zip_file', zip);
    fd.append('per_volume', document.getElementById('splitPerVolume').value);
    fd.append('duration', document.getElementById('splitDuration').value);
    fd.append('prefix', document.getElementById('splitPrefix').value);
    fetch('/admin/tools/import-python-fill/import', {
        method: 'POST',
        body: fd,
        headers: { 'X-CSRFToken': getCSRF() }
    }).then(function (r) { return r.json(); }).then(function (data) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload me-1"></i>开始导入';
        showReport(data);
    }).catch(function () {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-upload me-1"></i>开始导入';
        showReport({ success: false, message: '网络错误或服务器异常' });
    });
}

function showReport(data) {
    var card = document.getElementById('reportCard');
    var title = document.getElementById('reportTitle');
    var body = document.getElementById('reportBody');
    card.style.display = '';
    if (!data.success) {
        title.textContent = '导入失败';
        title.className = 'card-header fw-bold text-white bg-danger';
        var r = data.report || {};
        var html = '<div class="alert alert-danger mb-2">' + escapeHtml(data.message || '导入失败') + '</div>';
        if (r.skipped && r.skipped.length) {
            html += '<h6>跳过明细：</h6><ul>' + r.skipped.map(function (s) {
                return '<li>第 ' + s.num + ' 题：' + escapeHtml(s.reason) + '</li>';
            }).join('') + '</ul>';
        }
        body.innerHTML = html;
        return;
    }
    title.textContent = '导入成功';
    title.className = 'card-header fw-bold text-white bg-success';
    var r = data.report || {};
    var html = '<div class="alert alert-success">' + escapeHtml(data.message) + '</div>';
    html += '<h6>已创建试卷：</h6><ul>';
    (r.exams || []).forEach(function (name) {
        html += '<li><i class="fas fa-file-alt me-1 text-primary"></i>' + escapeHtml(name) + '</li>';
    });
    html += '</ul>';
    if (r.skipped && r.skipped.length) {
        html += '<h6 class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>跳过题目（未导入）：</h6><ul>';
        r.skipped.forEach(function (s) {
            html += '<li>第 ' + s.num + ' 题：' + escapeHtml(s.reason) + '</li>';
        });
        html += '</ul>';
    }
    html += '<div class="mt-2"><a href="/admin/exams" class="btn btn-sm btn-outline-primary">前往试卷管理查看</a></div>';
    body.innerHTML = html;
}

function clearAll() {
    document.getElementById('reviewFile').value = '';
    document.getElementById('zipFile').value = '';
    document.getElementById('reviewStatus').textContent = '尚未选择';
    document.getElementById('zipStatus').textContent = '尚未选择';
    document.getElementById('splitBox').style.display = 'none';
    document.getElementById('qCountBox').style.display = 'none';
    document.getElementById('reportCard').style.display = 'none';
}

function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
</script>
{% endblock %}

{% extends 'base.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:60vh;">
  <div class="card p-4 shadow-lg" style="min-width:380px;max-width:420px;">
    <div class="text-center mb-3">
      <i class="fas fa-lock fa-3x text-warning mb-2"></i>
      <h2>修改密码</h2>
      {% if session.get('student_id') %}
      <p class="text-muted mb-0">当前登录学生</p>
      {% endif %}
    </div>
    <form method="post">
      <div class="form-group mb-3">
        <label>原密码</label>
        <input type="password" name="old_password" class="form-control rounded-pill" required placeholder="请输入当前密码">
      </div>
      <div class="form-group mb-3">
        <label>新密码</label>
        <input type="password" name="new_password" class="form-control rounded-pill" required placeholder="请输入新密码（至少6位）">
      </div>
      <div class="form-group mb-3">
        <label>确认新密码</label>
        <input type="password" name="confirm_password" class="form-control rounded-pill" required placeholder="请再次输入新密码">
      </div>
      <button type="submit" class="btn btn-warning w-100 rounded-pill">
        <i class="fas fa-save me-1"></i>修改密码
      </button>
    </form>
  </div>
</div>
{% endblock %}

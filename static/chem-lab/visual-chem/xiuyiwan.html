<script>
    const COLORS = { C:0x2c3e50, H:0xecf0f1, O:0xe74c3c, Na:0xf39c12, Br:0x8b4513, Cu:0xc87533, S:0xf1c40f };
    const TEXT_COLORS = { C:'#222', H:'#777', O:'#e74c3c', Na:'#d35400', Br:'#8b4513', Cu:'#a65f2d', S:'#d4ac0d' };
    const RAD_BS = { C:0.45, H:0.25, O:0.40, Na:0.42, Br:0.55, Cu:0.48, S:0.50 };

    const TEXTS = {
        init: "<span class='badge bg-normal'>溴乙烷 C₂H₅Br</span><br>两个碳和溴均按 <b>sp³</b> 处理。C–C 约 1.50、C–H 约 1.09、C–Br 约 1.90，三维模式呈四面体；结构式模式为平面简式。",
        halide_hydro_1: "<span class='badge bg-br'>① OH⁻ 靠近 α-碳</span><br>溴乙烷的 C–Br 为极性键，Br 带 δ−、α-碳带 δ+。NaOH 在水中解离，OH⁻ 从 C–Br 键对面靠近 α-碳，准备取代 Br（进攻细节见进阶面板）。",
        halide_hydro_2: "<span class='badge bg-br'>② C–O 成键、C–Br 断键同步进行</span><br>OH⁻ 与 α-碳形成 C–O 键，同时 C–Br 的成键电子对转移到 Br，Br 以 Br⁻ 离去。",
        halide_hydro_3: "<span class='badge bg-succ'>③ 生成乙醇与 NaBr</span><br>CH₃CH₂Br + NaOH ——水,加热→ CH₃CH₂OH + NaBr。OH 取代 Br，α-碳保持 sp³。",
        halide_elim_1: "<span class='badge bg-acid'>① 醇溶液中 OH⁻ 作强碱，靠近 β-H</span><br>NaOH 的醇溶液碱性更强，OH⁻ 不作为亲核试剂进攻碳，而是靠近与溴相邻碳（β-碳）上的氢。",
        halide_elim_2: "<span class='badge bg-acid'>② 夺 β-H、出 π 键、Br 离去（协同一步）</span><br>碱夺取 β-H，C–H 电子对转为 C–C 的 π 键；同时 C–Br 断键、Br 以 Br⁻ 离去；被夺的 H 与 OH⁻ 结合成水（协同细节见进阶面板）。",
        halide_elim_3: "<span class='badge bg-succ'>③ 生成乙烯、NaBr 与 H₂O</span><br>CH₃CH₂Br + NaOH ——醇,加热→ CH₂=CH₂ + NaBr + H₂O。两个碳由 sp³ 变为 sp²，键角展开到 120°。"
    };
    const TRNS = {
        init: "等待选择反应",
        halide_hydro_1: "OH⁻ 靠近 α-碳，准备取代 Br",
        halide_hydro_2: "电子对：O→C 成键、C–Br→Br⁻（C–O 成键与 C–Br 断键同步）",
        halide_hydro_3: "生成乙醇（OH 取代 Br）与 NaBr",
        halide_elim_1: "OH⁻ 作碱靠近 β-H（水溶液→取代；醇溶液→消去）",
        halide_elim_2: "β-H 被夺，C–H 电子对转 π 键；C–Br 电子对转 Br⁻",
        halide_elim_3: "乙烯 sp² 平面 120°；β-H 与 OH⁻ 成水；NaBr 生成"
    };
    const CHIPS = {
        init:'溴乙烷 CH₃CH₂Br：C–C、C–H、C–Br 均为 σ 键；碳和溴为 sp³。C–Br 为极性键，Br 带 δ−。',
        halide_hydro:'OH⁻ 从 C–Br 键背面进攻 α-碳（SN2）：OH⁻ 的孤对电子形成 C–O 键，C–Br 键的电子对转移到 Br 生成 Br⁻；Br 被 OH 取代，α-碳构型翻转，生成乙醇与 NaBr。',
        halide_elim:'醇溶液中 OH⁻ 作强碱夺取 β-H：C–H 键电子对转成 C–C 的 π 键，C–Br 键电子对转移到 Br 生成 Br⁻；β-H 与 OH⁻ 结合成水，生成乙烯与 NaBr。'
    };

    function protonatedOHPositions(cId, oId) {

        const normal = Math.abs(towardC.z) < 0.9 ? new THREE.Vector3(0,0,1) : new THREE.Vector3(0,1,0);
        const side = new THREE.Vector3().crossVectors(normal, towardC).normalize();

        const h2 = towardC.clone().multiplyScalar(Math.cos(angle)).addScaledVector(radial, -Math.sin(angle)).multiplyScalar(0.96).add(o);

        ['C1','C2','H1','H2','H3','H4','H5','Br'].forEach(id => starts[id] = brBasePos(id).map((v,i)=>v+(i===0?-1.5:0)));
        const c2 = starts.C2;
        // OH⁻ 进攻路径：右下 → C2 背面（O···C···Br 近直线）→ C–O 成键位
        // 2D 的 NaOH 整体右移（Na 2.1、O 3.25、H 4.21），与 Br（0.5）拉开间距
        const oStart = is2D ? [3.25,0,0] : [3.3,0,0];
        const oAttack = is2D ? [c2[0], c2[1]-1.9, 0] : [c2[0], c2[1]-2.35, 0];
        // 3D 成键位取 Br 方向的 y 镜像（SN2 翻转后 OH 与 C1、H4、H5 构成 109.5° 四面体）
        const oBond = is2D ? [c2[0]+1.35, 0, 0] : [c2[0]+0.478, c2[1]-1.349, 0];
        let oPos;
        if (is2D) {
            // 2D：竖直升高 → 斜线到右侧低位等待（避开 Br 高位飞行）→ 水平移到成键位上方 → 竖直落下
            const oHigh = [3.25,2.2,0], oWait2 = [1.7,1.6,0], oAbove = [0.35,1.6,0];
            if (t < 20) oPos = oStart;
            else if (t < 30) oPos = mixPos(oStart, oHigh, t, 20, 30);
            else if (t < 44) oPos = mixPos(oHigh, oWait2, t, 30, 44);
            else if (t < 72) oPos = oWait2;
            else if (t < 84) oPos = mixPos(oWait2, oAbove, t, 72, 84);
            else if (t < 96) oPos = mixPos(oAbove, oBond, t, 84, 96);
            else oPos = oBond;
        } else {
            if (t < 20) oPos = oStart;
            else if (t < 45) oPos = mixPos(oStart, oAttack, t, 20, 45);
            else if (t < 62) oPos = mixPos(oAttack, oBond, t, 45, 62);
            else oPos = oBond;
        }
        // O–H 水平（0.96,0）：直线形 NaOH；产物 H–O–C 夹角 109.5°，旋转前后不变
        const hOffset = [0.96,0,0];
        setPos('HydO', oPos);
        setPos('HydH', oPos.map((v,i)=>v+hOffset[i]));
        // 三维模式：H4/H5 伞式翻转（夹角先张开后收拢，C–H 键长保持 1.09），与 OH 到位同步
        if (!is2D && t >= 48) {
            const f = smoothStep(Math.min(1, (t-48)/14));
            const c2Now = getA('C2').group.position.toArray();
            ['H4','H5'].forEach(id => {
                const s = new THREE.Vector3(...starts[id]).sub(new THREE.Vector3(...starts.C2));
                const target = s.clone(); target.y = -target.y;
                const dir = s.clone().normalize().lerp(target.normalize(), f).normalize();
                setPos(id, new THREE.Vector3(...c2Now).addScaledVector(dir, 1.09).toArray());
            });
        }
        // Br⁻ 先向右上方飞高再降落到 Na⁺ 右侧相切（3D 0.97；2D 1.15）
        if (is2D) {
            // 2D：竖直升高 → 高位水平右移 → 降落到 Na⁺ 右侧（三段，全程避开 Na⁺）
            if (t < 58) setPos('Br', starts.Br);
            else if (t < 68) setPos('Br', mixPos(starts.Br, [starts.Br[0],3.0,0], t, 58, 68));
            else if (t < 80) setPos('Br', mixPos([starts.Br[0],3.0,0], [3.85,3.0,0], t, 68, 80));
            else setPos('Br', mixPos([3.85,3.0,0], [3.85,0,0], t, 80, 92));
        } else {
            if (t < 58) setPos('Br', starts.Br);
            else if (t < 74) setPos('Br', mixPos(starts.Br, [3.37,2.6,0], t, 58, 74));
            else setPos('Br', mixPos([3.37,2.6,0], [3.37,0,0], t, 76, 90));
        }
        // Na⁺ 从直线位离开：3D 微调到位；2D 先升起绕行再降下与 Br⁻ 相切
        if (is2D) {
            // 2D：Na⁺ 全程在 y=0 水平微移（Br 走高位，不冲突）
            const naStart2 = [2.1,0,0];
            if (t < 60) setPos('NaHyd', naStart2);
            else setPos('NaHyd', mixPos(naStart2, [2.7,0,0], t, 60, 80));
        } else {
            if (t < 60) setPos('NaHyd', [2.48,0,0]);
            else setPos('NaHyd', mixPos([2.48,0,0], [2.4,0,0], t, 60, 72));
        }
        // 三维模式：产物乙醇整体绕 C–C 键轴旋转 180°，使羟基转到上方（刚体旋转保持四面体）
        if (!is2D && t >= 72) {
            const f = smoothStep(Math.min(1, (t-72)/22));
            const ang = Math.PI * f, cA = Math.cos(ang), sA = Math.sin(ang);
            ['C1','C2','H1','H2','H3','H4','H5','HydO','HydH'].forEach(id => {
                const a = getA(id); if (!a) return;
                const p = a.group.position;
                const y2 = p.y * cA - p.z * sA, z2 = p.y * sA + p.z * cA;
                a.setPosition(p.x, y2, z2);
            });
        }
        setBondBroken('C2-Br', t >= 58, t >= 52 && t < 62 ? 'break' : 'normal');
        const oBondT = is2D ? 96 : 62;
        setBondBroken('C2-HydO', t < oBondT, t >= (is2D?84:52) && t < oBondT ? 'make' : 'normal');
        setCharge('HydOMinus', t < oBondT ? 1 : 0);
        setCharge('BrMinus', t >= 58 ? 1 : 0);
        setCharge('NaHydPlus', 1);
    }

    function prepareHalideElim() {
        clearScene(); buildBromoethane(-1.4);
        // NaOH 醇溶液：OH⁻ 作强碱，夺取 β-H（C1 上的 H1）。
        // 构型与水解反应一致：直线形 Na–O–H 同一水平线，Na⁺ 与 O 相切（0.82）。
        new Atom3D('HydO','O',3.3,0,0); new Atom3D('HydH','H',4.26,0,0);
        new Atom3D('NaHyd','Na',2.48,0,0);
        new Bond3D('HydO-HydH', getA('HydO'), getA('HydH'));
        new Bond3D('HydO-H1', getA('HydO'), getA('H1')); getB('HydO-H1').isBroken = true;
        makeCharge('HydOMinus','−','HydO',[0.42,0.42,0],'#c0392b',1.0);
        makeCharge('H1Plus','+','H1',[0.38,0.4,0],'#c0392b');
        makeCharge('BrMinus','−','Br',[0.42,0.42,0],'#8b4513',1.0);
        makeCharge('NaHydPlus','+','NaHyd',[0.4,0.42,0],'#ca6f1e');
        halideDash = [createDashGroup(), createDashGroup()];
        setCamera(13); currentChip = CHIPS.halide_elim; updateLegend('halide');
        setEquations(`CH₃CH₂Br + NaOH ——醇,加热→ CH₂=CH₂ + NaBr + H₂O`, `<span class="eq-tag">消去</span>OH⁻ 夺 β-H，C–Br 断键，C–C → C=C`, 'var(--halide)');
        reactantLabels = [makeTextSprite('CH₃CH₂Br', -1.3, -1.55, 0), makeTextSprite('NaOH', 3.6, -1.55, 0)];
        makeTextSprite('NaOH醇溶液 / 加热', -3.1, 3.6, 0, 0.30, '#8a6d3b');
        setAdv('elim');
    }
    function updateHalideElim(t) {
        setTier('<span class="tier-chip tier-main">教材档 · 主动画</span><span class="tier-chip tier-adv">完整机理见进阶</span>');
        resetShiftedBromoethane(-1.4, 0);
        if (t < 22) setInfo(TEXTS.halide_elim_1, TRNS.halide_elim_1); else if (t < 72) setInfo(TEXTS.halide_elim_2, TRNS.halide_elim_2); else setInfo(TEXTS.halide_elim_3, TRNS.halide_elim_3);
        const is2D = viewMode === 'structural';
        const starts = {};
        ['C1','C2','H1','H2','H3','H4','H5','Br'].forEach(id => starts[id] = brBasePos(id).map((v,i)=>v+(i===0?-1.4:0)));
        // OH⁻ 沿上方弧线移到 t=33 的位置后停住等待；H⁺ 从左侧直接接近成键。
        // 水的 V 型：H⁺ 在氧左下方、OH⁻ 自带的 H 在氧右下方（O–H 0.96、H–O–H≈104.5°）。
        const oWait = is2D ? [-2.367,2.292,0] : [-1.846,2.338,0];
        const h1Off = [-0.759,-0.587,0], hydHOff = [0.759,-0.587,0];
        const hOffHydro = [0.96,0,0];
        let oNow;
        // 2D 的 NaOH 整体右移（Na 1.8、O 2.95、H 3.91），与 Br（0.6）拉开间距
        const oStart = is2D ? [2.95,0,0] : [3.3,0,0];
        if (is2D) {
            // 2D：先竖直上升到高处（避开 Na⁺），再水平横跨到 β-H 上方
            if (t < 16) oNow = mixPos(oStart, [oStart[0],2.2,0], t, 0, 16);
            else if (t < 40) {
                const f = smoothStep(Math.min(1,(t-16)/24));
                oNow = [oStart[0]+(oWait[0]-oStart[0])*f, 2.2+(oWait[1]-2.2)*f + 0.3*Math.sin(Math.PI*f), 0];
            }
            else oNow = oWait;
        } else if (t < 33) {
            const f = smoothStep(Math.min(1, t/33));
            oNow = [
                oStart[0] + (oWait[0]-oStart[0]) * f,
                oStart[1] + (oWait[1]-oStart[1]) * f + 1.8 * Math.sin(Math.PI * f),
                oStart[2] + (oWait[2]-oStart[2]) * f
            ];
        } else {
            oNow = oWait;
        }
        if (t >= 56) {
            if (t < 70) oNow = mixPos(oWait, [4.7, oWait[1], 0], t, 56, 70);
            else oNow = mixPos([4.7, oWait[1], 0], [4.7, 0, 0], t, 70, 85);
        }
        setPos('HydO', oNow);
        // β-H（H1）在 C1–H1 断键（t=42）后作为 H⁺ 从左侧直线接近 OH⁻，
        // t=52 到达氧左侧的 V 型位置，途中单调接近（不切过氧球）、不提前成键；
        // 未断键期间键长保持 1.09
        if (t < 42) setPos('H1', starts.H1);
        else if (t < 52) setPos('H1', mixPos(starts.H1, oNow.map((v,i)=>v+h1Off[i]), t, 42, 52));
        else setPos('H1', oNow.map((v,i)=>v+h1Off[i]));
        // OH⁻ 的 H：反应前保持水解构型（hOffHydro），t=42–52 与 H1 同步到位，
        // 结合成水的瞬间两 O–H 即呈 104.5° V 型；之后整水保持刚性移动
        const hMorph = t < 42 ? 0 : t >= 52 ? 1 : smoothStep(Math.min(1, (t-42)/10));
        setPos('HydH', oNow.map((v,i)=>v + hOffHydro[i] + (hydHOff[i]-hOffHydro[i]) * hMorph));
        // Br⁻ 先向右上方飞高再降落到 Na⁺ 右侧相切（3D 0.97；2D 1.15）
        if (is2D) {
            // 2D：竖直升高 → 高位水平右移 → 降落（三段，全程避开 Na⁺）
            if (t < 42) setPos('Br', starts.Br);
            else if (t < 48) setPos('Br', mixPos(starts.Br, [starts.Br[0],2.4,0], t, 42, 48));
            else if (t < 56) setPos('Br', mixPos([starts.Br[0],2.4,0], [3.05,2.4,0], t, 48, 56));
            else setPos('Br', mixPos([3.05,2.4,0], [3.05,0,0], t, 56, 64));
        } else {
            if (t < 42) setPos('Br', starts.Br);
            else if (t < 58) setPos('Br', mixPos(starts.Br, [2.87,2.6,0], t, 42, 58));
            else setPos('Br', mixPos([2.87,2.6,0], [2.87,0,0], t, 60, 78));
        }
        // Na⁺ 从直线位离开：3D 水平微调到位；2D 先升起绕行再降下与 Br⁻ 相切
        if (is2D) {
            // 2D：Na⁺ 全程在 y=0 水平微移（Br 走高位，不冲突）
            const naStart2 = [1.8,0,0];
            if (t < 52) setPos('NaHyd', naStart2);
            else setPos('NaHyd', mixPos(naStart2, [1.9,0,0], t, 52, 64));
        } else {
            if (t < 52) setPos('NaHyd', [2.48,0,0]);
            else setPos('NaHyd', mixPos([2.48,0,0], [1.9,0,0], t, 52, 64));
        }
        // 虚线电子对：C1–H1（20–38）、C2–Br（30–40），在 t=42 三键同步断键前出现
        const dashWindows = [ { a:'C1', b:'H1', t0:20, t1:38 }, { a:'C2', b:'Br', t0:30, t1:40 } ];
        dashWindows.forEach((w, idx) => {
            const g = halideDash[idx];
            if (g && t >= w.t0 && t < w.t1) placeDash(g, w.a, w.b);
            else if (g) g.visible = false;
        });
        // C–C 单键→双键，sp³→sp²：乙烯平面、键角 120°。
        // 乙烯在溴乙烷原位置原地生成（C–C 中心保持 −1.4，不右移）。
        const ethene = { C1:[-2.07,0,0], C2:[-0.73,0,0], H2:[-2.615,0.944,0], H3:[-2.615,-0.944,0], H4:[-0.185,0.944,0], H5:[-0.185,-0.944,0] };
        if (t >= 42) {
            const f = smoothStep(Math.min(1,(t-42)/16));
            const lerpArr = (a,b) => a.map((v,i)=>v+(b[i]-v)*f);
            const c1Now = lerpArr(starts.C1, ethene.C1), c2Now = lerpArr(starts.C2, ethene.C2);
            setPos('C1', c1Now); setPos('C2', c2Now);
            const placeH = (id, cStart, cNow, cTarget, hTarget) => {
                const sDir = new THREE.Vector3(...starts[id]).sub(new THREE.Vector3(...cStart));
                const hLen = sDir.length(); sDir.normalize();
                const tDir = new THREE.Vector3(...hTarget).sub(new THREE.Vector3(...cTarget)).normalize();
                const dir = sDir.clone().lerp(tDir, f).normalize();
                setPos(id, new THREE.Vector3(...cNow).addScaledVector(dir, hLen).toArray());
            };
            placeH('H2', starts.C1, c1Now, ethene.C1, ethene.H2);
            placeH('H3', starts.C1, c1Now, ethene.C1, ethene.H3);
            placeH('H4', starts.C2, c2Now, ethene.C2, ethene.H4);
            placeH('H5', starts.C2, c2Now, ethene.C2, ethene.H5);
        }
        // E2 协同一步：t=42 同时断 C1–H1、断 C2–Br、C–C 出 π 键，两碳直接由 sp³ 进入 sp²
        setBondBroken('C1-H1', t >= 42, t >= 36 && t < 46 ? 'break' : 'normal');
        setBondBroken('C2-Br', t >= 42, t >= 36 && t < 46 ? 'break' : 'normal');
        getB('C1-C2').setColorState(t >= 36 && t < 44 ? 'make' : 'normal');
        setBondOrder('C1-C2', t >= 42 ? 2 : 1);
        // H⁺ 先移动到水的 V 型位置（t=52 到位），到位后才显示 O–H 键，键角不再变化
        setBondBroken('HydO-H1', t < 52, t >= 52 && t < 60 ? 'make' : 'normal');
        setCharge('HydOMinus', t < 52 ? 1 : 0);
        setCharge('H1Plus', t >= 42 && t < 52 ? 1 : 0);
        setCharge('BrMinus', t >= 42 ? 1 : 0);
        setCharge('NaHydPlus', 1);
    }

    function updateLegend(type) {
        // 图例只示例单个原子及其颜色
        const atomSets = {
            halide:['C','H','Br','Na','O']
        };
        const names = { C:'碳', H:'氢', O:'氧', Na:'钠', Br:'溴', Cu:'铜' };
        const colors = { C:'#34495e', H:'#f5f6fa', O:'#e74c3c', Na:'#f39c12', Br:'#8b4513', Cu:'#c87533' };
        const list = (atomSets[type] || ['C','H','O']).map(a => {
            const border = a === 'H' ? 'border:1px solid #bdc3c7;' : '';
            return `<div class="legend-item"><span class="legend-color" style="background:${colors[a]};${border}"></span>${a}：${names[a]}</div>`;
        }).join('');
        document.getElementById('legendBox').innerHTML = list;
    }
    function showProductLabels(type) {
        reactantLabels.forEach(s => { s.visible = false; });
        if (type === 'halide_hydro') { makeProductLabel('乙醇 CH₃CH₂OH', -0.8, -2.55, 0); makeProductLabel('NaBr', 2.4, -2.55, 0); }
        else if (type === 'halide_elim') { makeProductLabel('乙烯 CH₂=CH₂', -1.4, -1.55, 0); makeProductLabel('NaBr', 2.4, -1.55, 0); makeProductLabel('H₂O', 4.7, -1.55, 0); }
    }

    function updateScene() {
        if (currentReaction === 'none') return;
        const t = parseFloat(slider.value);
        if (currentReaction === 'halide_hydro') updateHalideHydro(t);
        else if (currentReaction === 'halide_elim') updateHalideElim(t);
        updateCharges();
        bonds.forEach(b => b.updatePosition());
        if (t >= 100 && !productLabels.length) showProductLabels(currentReaction);
        if (t < 100 && productLabels.length) clearProductLabels();
    }
    function refreshNow() { updateScene(); controls.update(); renderer.render(scene, camera); }
    function startReaction(type, btnId) {
        currentReaction = type; document.querySelectorAll('.btn-reaction').forEach(btn => btn.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');
        isPlaying = false; playPauseBtn.innerText = '▶️'; slider.value = 0; progressText.innerText = '0%';
        document.getElementById('progressContainer').classList.add('active');
        if (type === 'halide_hydro') prepareHalideHydro();
        else if (type === 'halide_elim') prepareHalideElim();
        refreshNow();
    }

    function rebuildCurrentReactionForView() {
        const type = currentReaction;
        const t = parseFloat(slider.value);
        clearProductLabels();
        if (type === 'none') { initNormal(); return; }
        if (type === 'halide_hydro') prepareHalideHydro();
        else if (type === 'halide_elim') prepareHalideElim();
        slider.value = t; progressText.innerText = Math.round(t) + '%'; refreshNow();
    }

    playPauseBtn.addEventListener('click', () => {
        if (parseFloat(slider.value) >= 100) { slider.value = 0; progressText.innerText = '0%'; clearProductLabels(); refreshNow(); }
        isPlaying = !isPlaying; playPauseBtn.innerText = isPlaying ? '⏸️' : '▶️';
    });
    slider.addEventListener('input', () => { isPlaying = false; playPauseBtn.innerText = '▶️'; progressText.innerText = Math.round(slider.value) + '%'; refreshNow(); });
    document.getElementById('btnBallStick').addEventListener('click', () => { if (viewMode === 'ballstick') return; viewMode = 'ballstick'; document.getElementById('btnBallStick').classList.add('active'); document.getElementById('btnStructural').classList.remove('active'); rebuildCurrentReactionForView(); });
    document.getElementById('btnStructural').addEventListener('click', () => { if (viewMode === 'structural') return; viewMode = 'structural'; document.getElementById('btnStructural').classList.add('active'); document.getElementById('btnBallStick').classList.remove('active'); rebuildCurrentReactionForView(); });
    document.getElementById('btnHalideHydro').addEventListener('click', () => startReaction('halide_hydro','btnHalideHydro'));
    document.getElementById('btnHalideElim').addEventListener('click', () => startReaction('halide_elim','btnHalideElim'));
    document.getElementById('btnReset').addEventListener('click', () => {
        currentReaction = 'none'; isPlaying = false; playPauseBtn.innerText = '▶️'; document.getElementById('progressContainer').classList.remove('active');
        document.querySelectorAll('.btn-reaction').forEach(btn => btn.classList.remove('active')); initNormal();
    });

    // 重置视角：回到当前状态的默认机位（未选反应 10.5，反应中 13），并复位 OrbitControls 目标
    document.getElementById('btn-reset-view').addEventListener('click', () => {
        setCamera(currentReaction === 'none' ? 10.5 : 13);
    });

    window.addEventListener('resize', () => { camera.aspect = canvasWrap.clientWidth / canvasWrap.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(canvasWrap.clientWidth, canvasWrap.clientHeight); });
    const prog = document.getElementById('progressContainer'); let dragging = false, sx = 0, sy = 0, left0 = 0, top0 = 0;
    prog.addEventListener('mousedown', e => {
        if (e.target.tagName === 'INPUT' || e.target.id === 'playPauseBtn') return;
        dragging = true; sx = e.clientX; sy = e.clientY; const r = prog.getBoundingClientRect(), pr = prog.parentElement.getBoundingClientRect();
        left0 = r.left - pr.left; top0 = r.top - pr.top; prog.style.bottom = 'auto'; prog.style.transform = 'none'; prog.style.left = left0 + 'px'; prog.style.top = top0 + 'px';
    });
    window.addEventListener('mousemove', e => {
        if (!dragging) return; const pr = prog.parentElement.getBoundingClientRect();
        const nx = Math.max(0, Math.min(pr.width - prog.offsetWidth, left0 + e.clientX - sx));
        const ny = Math.max(0, Math.min(pr.height - prog.offsetHeight, top0 + e.clientY - sy));
        prog.style.left = nx + 'px'; prog.style.top = ny + 'px';
    });
    window.addEventListener('mouseup', () => dragging = false);

    function animate() {
        requestAnimationFrame(animate); controls.update();
        if (currentReaction !== 'none' && isPlaying) {
            let v = parseFloat(slider.value) + 0.12;
            if (v >= 100) { v = 100; isPlaying = false; playPauseBtn.innerText = '▶️'; }
            slider.value = v; progressText.innerText = Math.round(v) + '%';
        }
        updateScene(); renderer.render(scene, camera);
    }
    initNormal(); animate();
</script>
<script>window.BACK_SUBNAV = 'subnav-organic';</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>晶胞原点转换 · 四晶胞合集 - 可视化化学</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    #stage {
        display: block; width: 100%; height: 100%; border: 0;
        background: #000;
        position: absolute; left: 0; top: 0;
        transform-origin: 50% 50%;
        /* 切换晶胞时淡出 → 换页 → 新页画面出来再淡入，避免整块 3D 突然重建的黑闪 */
        opacity: 0; transition: opacity 0.28s ease;
    }
    #stage.shown { opacity: 1; }

    /* ============ 左侧一列：晶胞种类在上、操作按钮在下 ============ */
    #switcher {
        position: fixed; top: 84px; left: 14px; z-index: 9999;
        display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
        user-select: none; -webkit-user-select: none;
    }
    /* 半透明只给「晶胞列表」，操作按钮要一直清楚（父级 opacity 会连带乘到子级，所以分开写） */
    #sw-list { opacity: 0.82; transition: opacity 0.28s ease; }
    #switcher:hover #sw-list,
    #switcher:focus-within #sw-list { opacity: 1; }
    #sw-toggle {
        display: inline-flex; align-items: center; gap: 6px;
        width: auto; height: 38px; padding: 0 12px; border-radius: 12px;
        border: 1px solid rgba(150, 180, 255, 0.26);
        background: rgba(16, 22, 38, 0.88);
        color: #cfe0ff; font-size: 15px; line-height: 1; cursor: pointer;
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    #sw-toggle:hover { background: rgba(28, 38, 62, 0.94); color: #fff; }
    .sw-toggle-label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.3px; }
    /* 折叠后只留「晶胞」按钮，避免遮挡画布与功能模块 */
    #switcher:not(.open) #sw-list,
    #switcher:not(.open) #bar { display: none !important; }
    #switcher.open #sw-list { display: flex; }
    #sw-list {
        display: flex; flex-direction: column; gap: 6px; align-items: stretch;
        padding: 8px;
        border-radius: 14px;
        border: 1px solid rgba(150, 180, 255, 0.20);
        background: rgba(14, 19, 33, 0.74);
        -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
    }
    .sw-item {
        position: relative;
        display: flex; align-items: center; gap: 8px;
        width: 132px; padding: 7px 10px 7px 9px;
        border-radius: 9px; border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.035);
        color: #b9c6e0; text-align: left; cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }
    .sw-item::before {
        content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
        width: 3px; height: 0; border-radius: 0 3px 3px 0;
        background: var(--c, #7fb0ff);
        transition: height 0.22s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .sw-item:hover { background: rgba(255, 255, 255, 0.075); color: #e6eeff; }
    .sw-item:active { transform: scale(0.975); }
    .sw-item.on {
        background: rgba(255, 255, 255, 0.10);
        border-color: rgba(160, 195, 255, 0.28);
        color: #ffffff;
    }
    .sw-item.on::before { height: 62%; }
    .sw-dot {
        flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
        background: var(--c, #7fb0ff);
        box-shadow: 0 0 8px var(--c, #7fb0ff);
        opacity: 0.55; transition: opacity 0.18s ease;
    }
    .sw-item.on .sw-dot { opacity: 1; }
    .sw-f {
        font-size: 13px; font-weight: 700; letter-spacing: 0.2px;
        font-variant-numeric: tabular-nums;
    }
    .sw-n { font-size: 11.5px; opacity: 0.78; margin-left: auto; }
    .sw-f sub { font-size: 0.68em; vertical-align: -0.22em; }

    /* 操作栏：接在晶胞列表下面，同一列（都在左侧），宽度与列表对齐 */
    #bar {
        display: flex; flex-direction: column; align-items: stretch; gap: 6px;
        min-width: 150px; padding: 8px;
        border-radius: 14px; border: 1px solid rgba(150, 180, 255, 0.20);
        background: rgba(14, 19, 33, 0.74);
        -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
        opacity: 0.72; transition: opacity 0.25s ease;
    }
    #bar:hover { opacity: 1; }
    #bar button {
        padding: 8px 10px; border-radius: 9px; cursor: pointer; text-align: center;
        border: 1px solid rgba(160, 195, 255, 0.26);
        background: rgba(255, 255, 255, 0.07); color: #dce8ff;
        font-size: 12.5px; font-family: inherit; white-space: nowrap;
    }
    #bar button:hover { background: rgba(255, 255, 255, 0.16); }
    #bar button:disabled { opacity: 0.35; cursor: default; }
    #bar-step {
        background: rgba(255, 171, 61, 0.18);
        border-color: rgba(255, 171, 61, 0.36); color: #ffd9a0;
    }
    #bar-step:hover { background: rgba(255, 171, 61, 0.30); }
    #bar-state {
        display: none; font-size: 11px; color: rgba(170, 190, 224, 0.80);
        text-align: center; white-space: nowrap; letter-spacing: 0.2px;
    }
    #bar-state.on { display: block; }
    #bar-state b { color: #ffd9a0; font-weight: 600; }

    /* 依赖加载失败兜底 */
    #fail-tip {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        z-index: 10000; width: min(430px, 88vw);
        padding: 20px 22px; border-radius: 16px;
        background: rgba(20, 26, 42, 0.95);
        border: 1px solid rgba(255, 170, 120, 0.34);
        color: #e8eefc; font-size: 13px; line-height: 1.75;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
    }
    #fail-tip b { display: block; font-size: 14.5px; margin-bottom: 8px; color: #ffc98a; }
    #fail-tip code {
        background: rgba(255, 255, 255, 0.09); padding: 1px 5px;
        border-radius: 4px; font-size: 11.5px; word-break: break-all;
    }
    #fail-tip button {
        margin-top: 14px; padding: 7px 18px; border-radius: 9px;
        border: 1px solid rgba(160, 195, 255, 0.30);
        background: rgba(255, 255, 255, 0.08); color: #dce8ff;
        cursor: pointer; font-size: 12.5px;
    }
    #fail-tip button:hover { background: rgba(255, 255, 255, 0.16); }

    @media (max-width: 900px) {
        #switcher { top: 74px; left: 10px; gap: 6px; }
        #sw-list { padding: 6px; max-height: 62vh; overflow-y: auto; }
        .sw-item { width: 118px; }
        #bar { min-width: 132px; padding: 6px; gap: 5px; }
    }
    @media (max-width: 560px) {
        #switcher { left: 8px; top: 70px; }
        #bar { min-width: 120px; padding: 6px; gap: 5px; }
        #bar button { padding: 6px 8px; font-size: 11.5px; }
        #bar-state { display: none; }
        .sw-item { width: 106px; padding: 6px 8px; }
        .sw-n { display: none; }
    }
</style>
<link rel="stylesheet" href="ui-glass.css">
<style>
    /* ★ 必须写在 ui-glass.css 之后：那边 #topbar 是按「文档流里的第一行」写的
       （position:relative + 固定高度），这里是悬浮在 3D 舞台上方的一层，要覆盖掉。 */
    #topbar {

    @media (max-width: 720px) {

</style>

<style id="chem-lab-embed-style">
  /* ITstudy 化学仿真统一壳：隐藏原站顶栏/品牌/版权水印。
     不强制页面高度与 overflow —— 各页面自有布局（周期表需要滚动，

  /* 课堂 iframe 高度较小时：周期表隐藏趋势图、压缩行高，保证 118 元素可见 */

<body>

<!-- 顶部品牌栏（与其他晶胞页同一套 ui-glass.css） -->
<div id="topbar" class="glass">
    <div class="brand">
        <img id="brand-logo" src="favicon.png" alt="可视化化学">
        <div class="brand-text">
            <div class="brand-title">可视化化学<span class="brand-divider">·</span>可视化学</div>

<iframe id="stage" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>

<div id="switcher" class="open">
    <button id="sw-toggle" type="button" title="收起晶胞切换" aria-label="收起晶胞切换" aria-expanded="true">
        <span id="sw-toggle-icon" aria-hidden="true">▾</span><span class="sw-toggle-label">晶胞</span>
    </button>
    <div id="sw-list">
        <button class="sw-item on" data-src="cscl.html" data-key="cscl" style="--c:#ffab3d" title="源文件：cscl.html">

        </button>
        <button class="sw-item" data-src="nacl.html" data-key="nacl" style="--c:#b47cf0" title="源文件：nacl.html">

        <button class="sw-item" data-src="_vip/zns.html" data-key="zns" style="--c:#e8cd3c" title="源文件：_vip/zns.html">

        </button>
        <button class="sw-item" data-src="_vip/caf2.html" data-key="caf2" style="--c:#5fd8a8" title="源文件：_vip/caf2.html">
            <i class="sw-dot"></i><span class="sw-f">CaF<sub>2</sub></span><span class="sw-n">氟化钙</span>
        </button>
    </div>

    <!-- 操作栏：接在晶胞列表下面，同一列（左侧） -->
    <div id="bar">
        <button id="bar-step">① 重新分开</button>
        <button id="bar-cam">视角：透视</button>
        <button id="bar-auto">自动：关</button>
        <button id="bar-rot">旋转：开</button>
        <span id="bar-state" class="on">加载中</span>
    </div>
</div>

<script>
(function () {
    var frame = document.getElementById('stage');
    var list = document.getElementById('sw-list');
    var switcher = document.getElementById('switcher');
    var toggle = document.getElementById('sw-toggle');
    var items = list.querySelectorAll('.sw-item');
    var barStep = document.getElementById('bar-step');
    var barCam = document.getElementById('bar-cam');
    var barAuto = document.getElementById('bar-auto');
    var barRot = document.getElementById('bar-rot');
    var barState = document.getElementById('bar-state');
    var camOrtho = false;          /* 当前视角：false 透视 / true 正交（切页后要重发） */
    var current = 'cscl';
    /* 默认自己点；地址后加 ?auto=1 才自动轮播 */
    var autoOn = /[?&]auto=1/.test(location.search);
    /* 模型自转默认「关」；地址后加 ?rot=1 才让它转（用户要求：打开就是静止画面） */
    var rotOn = /[?&]rot=1/.test(location.search);

    /* 只留 3D 舞台：顶栏 / 左侧功能模块 / 右侧信息面板 / 横屏提示 全部剪掉 */
    var BARE_CSS =
        '#topbar,#sidebar,#info-sidebar,#rotate-hint,#cell-panel{display:none!important}' +
        '#scene-boundary,#op-tip-bar,#op-tip-sw{display:none!important}' +
        '#app-container{padding:0!important;display:block!important}' +
        '#main-row{width:100%!important;height:100%!important;padding:0!important;margin:0!important;gap:0!important;display:block!important}' +
        '#canvas-area{width:100%!important;height:100vh!important;padding:0!important;margin:0!important;border-radius:0!important}';

    /* 注入到源页里的小驱动：由外壳通过 postMessage 指挥，不直接改源页的动画代码。
       —— 用 postMessage 而不是让外壳取 contentDocument，是因为 file:// 下 sandbox 会拿不到文档。 */
    var DRIVER = '<scr' + 'ipt>(function(){' +
        'var n=0, timer=null, on=false, armed=false;' +
        'function btn(){return document.getElementById("btn-transform");}' +
        'function desc(){var d=document.getElementById("transform-desc");return d?d.innerText:"";}' +
        'function post(){try{parent.postMessage({__ydn:1,n:n,desc:desc(),on:on},"*");}catch(e){}}' +
        /* 页面在初始化 / 自己动画期间会把按钮置为 pointer-events:none（各页 setUIEnabled 干的），
           这时点下去不算数 —— 隔 400ms 重试，最多 retry 次，别把这一拍白白丢掉。 */
        /* busyUntil：上一次转换动画没走完就再点，源页的 __cancelAll 会把上一段动画组留在场景里，
           变成白色小球和漂浮的断键 —— 所以动画期间一律不点，只排队等它结束。 */
        'var busyUntil=0;' +
        'function step(retry){' +
        /* 有增强脚本就交给它（交叉晶胞）；没有才退回点源页按钮 */
        'if(window.__ydnNext||window.__ydnToggle){var ok=false;try{ok=(window.__ydnNext||window.__ydnToggle)();}catch(e){ok=false;}' +
        'if(!ok&&retry>0)setTimeout(function(){step(retry-1);},300);if(ok){n++;post();}return ok;}' +
        'var b=btn();if(!b)return false;' +
        'if(Date.now()<busyUntil){if(retry>0)setTimeout(function(){step(retry-1);},400);return false;}' +
        'if(b.disabled||b.style.pointerEvents==="none"){' +
        'if(retry>0)setTimeout(function(){step(retry-1);},400);return false;}' +
        'busyUntil=Date.now()+5200;' +
        'b.click();n++;post();setTimeout(post,5200);return true;}' +
        'function auto(){clearInterval(timer);if(!on)return;timer=setInterval(function(){if(armed)step(3);},4800);}' +
        /* 等页面把 3D 场景建好（canvas 出现）再开始，避免点在初始化阶段被吞掉。
           ★ 这里绝不自动点第一步：切到某个晶胞时画面必须是「完整晶胞」，
             要分开得用户自己按「① 重新分开」（自动播放开着时由 auto() 的计时器负责）。 */
        'function arm(){if(armed)return;if(!document.querySelector("canvas")){setTimeout(arm,400);return;}' +
        'armed=true;window.dispatchEvent(new Event("resize"));auto();}' +
        'window.addEventListener("message",function(e){var m=e.data||{};' +
        'if(m.__cmd==="step"){step(16);}' +
        'else if(m.__cmd==="auto"){on=!!m.on;auto();post();}' +
        'else if(m.__cmd==="rot"){try{if(window.__ydnRot)window.__ydnRot(!!m.on);}catch(e){}}' +
        'else if(m.__cmd==="cam"){try{if(window.__ydnCam)window.__ydnCam(!!m.ortho);}catch(e){}}' +
        'else if(m.__cmd==="state"){post();}' +
        'else if(m.__cmd==="arm"){arm();}});' +
        'window.addEventListener("load",function(){setTimeout(arm,300);});' +
        'setTimeout(arm,800);' +
        '})();</scr' + 'ipt>';

    /* 注入到源页里的「增强」：不动源页的动画代码，只做两件事
       ① 关掉原子点击（把射线打成空结果，拖动旋转不受影响）；
       ② 转换原点改成「加一个晶胞」——把当前晶胞整体克隆一份，平移到最近的异种离子上。
          平移一个最近邻矢量后，原来在体心/棱心的异种离子正好落到顶点，所以克隆出来那份
          就是「换了原点」的晶胞；两份叠在一起 = 两个交叉的立方框，旧键一根都不消失。 */
    var ENHANCE = '<scr' + 'ipt>(function(){' +
        'if(!window.THREE||typeof crystalGroup==="undefined")return;' +
        'var P=THREE.Raycaster.prototype;' +
        'if(!P.__ydnNoRay){P.__ydnNoRay=1;P.intersectObjects=function(){return [];};P.intersectObject=function(){return [];};}' +
        'var off=null,offB=null,ghost=null,busy=false,live=false,phase=0,DUR=900,fillN=0,fillErr="";' +
        'function key(x,y,z){return Math.round(x*20)+"_"+Math.round(y*20)+"_"+Math.round(z*20);}' +
        'function eachSphere(root,cb){root.traverse(function(o){if(o.isMesh&&o.geometry&&o.geometry.type==="SphereGeometry")cb(o);});}' +
        /* 源页里「键」比「晶胞棱框」粗：CsCl 0.08 / 0.04、NaCl 0.05 / 0.03、CaF₂ 0.06 / 0.03。
           ★ 不能写死阈值（0.06 会把 NaCl 的键当成棱），按场景里最细的圆柱动态判。 */
        'var EDGER=0;' +
        'function edgeR(){if(EDGER)return EDGER;var m=1e9;' +
        '  crystalGroup.traverse(function(o){if(o.isMesh&&o.geometry&&String(o.geometry.type).indexOf("Cylinder")>=0){' +
        '    var p=o.geometry.parameters||{},r=Math.max(p.radiusTop||0,p.radiusBottom||0);if(r>0&&r<m)m=r;}});' +
        '  EDGER=(m===1e9)?0:m*1.15;return EDGER;}' +
        'function isEdge(o){var p=(o.geometry&&o.geometry.parameters)||{};' +
        '  return Math.max(p.radiusTop||0,p.radiusBottom||0)<=edgeR();}' +
        /* ★ 当前是哪一页（外壳注入 window.__YDNKEY）。以前靠 off 的方向猜：
           「纯 x 轴向 ⇒ 氯化钠」，一旦氟化钙改成水平插入，off 也变成纯 x，就认错了。
           所以判定改用页面 key；key 缺失时才退回方向判断（单独打开源页时）。 */
        'var PAGE=(typeof window.__YDNKEY==="string")?window.__YDNKEY:"";' +
        'function isFluor(){return PAGE==="caf2";}' +
        /* 最近的异种离子：从原点那颗离子出发，找距离最近的另一颗球，就是半个晶胞的平移量 */
        'function offset(){var b=null,bd=1e9;' +
        '  eachSphere(crystalGroup,function(o){var p=o.position,d=Math.sqrt(p.x*p.x+p.y*p.y+p.z*p.z);' +
        '    if(d<0.3)return;' +
        '    if(d<bd-0.02){bd=d;b=p.clone();}' +
        '    else if(Math.abs(d-bd)<0.02&&b&&(p.x+p.y+p.z)>(b.x+b.y+b.z)){b=p.clone();}});' +
        /* ★ 分开的方向要「看起来」水平：源页相机 up=(0,0,1)，+z 正好是屏幕竖直方向，
           氯化钠的最近邻又只沿坐标轴 ⇒ 两个面心立体会一上一下。改走 x（左右并排），
           长度不变。只有「纯轴向」的平移才换 —— 氯化铯是体对角线、硫化锌/氟化钙是
           1/4 体对角线，x、y 分量都不为 0，一律不受影响。 */
        '  if(b&&Math.abs(b.x)<1e-3&&Math.abs(b.y)<1e-3&&Math.abs(b.z)>1e-3)b=new THREE.Vector3(b.z,0,0);' +
        '  return b;}' +
        /* ★ 氯化铯 / 硫化锌：在 8 个「等价的体对角线」里挑一个落在「屏幕左·上·往里（远离相机）」的。
           立方晶胞这些方向完全等价，换一个位置不会多出或少掉原子 —— 用户原话：

    function injectBase(html, key) {
        var base = new URL('/chem-lab/visual-chem/', location.origin).href;
        html = html.replace(/<script[^>]*>[\s\S]*?wb-root-base[\s\S]*?<\/script>/i, '');
        html = html.replace(/<base\b[^>]*>/i, '');
        html = html.replace(/<head[^>]*>/i, function (m) {
            return m + '<base href="' + base + '">' +
                /* 当前页 key：增强脚本要靠它区分氯化钠（水平、钠多一步）和氟化钙（水平插入、
                   只有三步）—— 两页最后都走「纯 x 方向」，只看 off 已经分不出来了 */
                '<scr' + 'ipt>window.__YDNKEY=' + JSON.stringify(String(key || '')) +
                ';window.__YDNROT=' + (rotOn ? 1 : 0) + ';</scr' + 'ipt>' +
                '<style id="__bare">' + BARE_CSS + '</style>';
        });
        return html.replace(/<\/body>/i, DRIVER + ENHANCE + '</body>');
    }

    var reqSeq = 0;
    var bootTimer = null;
    var fadeTimer = null;

    function hideStage() { frame.classList.remove('shown'); }
    function showStage() {
        clearTimeout(fadeTimer); fadeTimer = null;
        frame.classList.add('shown');
    }
    /* 等新页真画出 canvas 再淡入，避免淡进一块黑屏；最多等约 2 秒 */
    function revealStage(my, n) {
        if (my !== reqSeq) return;
        try {
            var d = frame.contentDocument;
            if (d && d.querySelector('canvas')) { showStage(); return; }
        } catch (e) {}
        if (n > 0) setTimeout(function () { revealStage(my, n - 1); }, 90);
        else showStage();
    }

    function load(key, file) {
        current = key;
        activate(key);
        removeFail();
        clearTimeout(bootTimer);
        setState('加载中');
        var my = ++reqSeq;
        hideStage();
        clearTimeout(fadeTimer);
        fadeTimer = setTimeout(showStage, 2200);   /* 万一 load 事件没来，别把页面留黑 */
        var stageUrl = '/chem-lab/visual-chem/' + file;
        fetch(stageUrl, { cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(function (html) {
                if (my !== reqSeq) return;
                /* 先让旧画面淡出走完再换 srcdoc：换得太快时，新页的 load 事件会
                   立刻触发淡入，把只走到一半的淡出取消，看着仍是「啪」一下换掉。 */
                setTimeout(function () {
                    if (my !== reqSeq) return;
                    frame.removeAttribute('src');
                    frame.srcdoc = injectBase(html, key);
                }, 260);
            })
            .catch(function () {
                if (my !== reqSeq) return;
                /* file:// 下浏览器不让 fetch 本地文件，只能整页引用：
                   界面剪不掉、也点不到源页按钮，所以明说一句，别让人以为坏了 */
                frame.removeAttribute('srcdoc');
                frame.src = stageUrl;
                setState('本地打开：仅整页模式');
                barState.title = '双击本地文件时浏览器禁止网页读取同目录的源页面，' +
                    '只能整页显示。用本地服务（http://127.0.0.1:8765/jingbao-yuandian.html）或线上地址打开，才是只留动画的版本。';
            });

    function activate(key) {
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle('on', items[i].dataset.key === key);
        }
    }

    /* 源页的相机是按横向画面取景的：手机竖屏下画布变成窄高，晶胞会左右被裁。
       这里在竖屏时把 iframe 的内部画布撑宽（高度不变），再整体等比缩小回屏幕宽度 ——
       页面底色是黑的，四周多出来的空白看不出来，晶胞就能完整入画。 */
    function fitFrame() {
        var vw = window.innerWidth, vh = window.innerHeight;
        frame.style.transform = 'none';
        frame.style.width = vw + 'px';
        frame.style.height = vh + 'px';
        frame.style.left = '0px';
        if (vw >= vh * 0.95) return;
        var w = Math.round(vh);
        var sc = vw / w;
        frame.style.width = w + 'px';
        frame.style.left = Math.round((vw - w) / 2) + 'px';
        frame.style.transform = 'scale(' + sc.toFixed(4) + ')';
    }

    function setState(txt) {
        if (!txt) { barState.classList.remove('on'); barState.textContent = ''; return; }
        barState.classList.add('on');
        barState.textContent = txt;
    }

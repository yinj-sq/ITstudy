# ============================================================
# ITstudy Nginx reverse proxy sample
# Replace the server_name and alias/root paths before production use.
# Default install path (Windows installer):
#   C:/Program Files/ITstudy
#
# 反向代理部署须知（在服务/环境变量instance\deploy.conf中设置，Nginx 无法代设应用 env）：
#
# 安全须知（重要）：
#   私有上传目录（作业提交 / 作业附件 / 分块 / 小组·个人网盘 / 学生作品 /
#   Python 答案 / 教学资料）与课件目录必须代理回应用（下方 location 已配置），
#   由 Flask 层做归属鉴权、课件可见性校验、主动内容中和与 CORS。
#   切勿改为 Nginx 直接静态服务——否则学生数据可被匿名枚举下载。
# ============================================================

server {
    # 端口共存说明（本机 C:\nginx 已部署的其他站点）：
    #   eduboard                   → listen 8080（server_name _ 通配）
    #   AI-Teaching-Platform       → listen 80（server_name _ 通配）
    # 本项目使用 8081 避免冲突；独立部署时可改回 80；
    # 内网 IP 直访流量（Host 不匹配本项目 server_name 时落入通配 server）。
    # 端口唯一时 server_name 不匹配也由本 server 兜底，IP 直访正常。
    # 若目标机器 nginx 80 已被使用，可改 listen 8081。
    listen 8081;
    # 部署时替换为你的域名或访问 IP（多值空格分隔）。
    # 示例：server_name itstudy.example.com 192.168.1.100 localhost 127.0.0.1;
    # 注意：server_name 需与应用内 TRUSTED_HOSTS 保持一致（见文件头说明）；
    # 用内网 IP 访问时 TRUSTED_HOSTS 需包含该 IP。
    server_name localhost 127.0.0.1;

    client_max_body_size 210m;  # 与应用全局 MAX_CONTENT_LENGTH=210MB 对齐；JSON 请求 25MB 与 multipart 200MB 限制在应用层强制，作业附件（≤100MB）等单请求上传不受 nginx 拦截（分块上传不受此限）

    gzip on;
    gzip_min_length 512;
    # text/html 由 mime.types 默认压缩，无需（也不可）重复列出
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss
               text/javascript image/svg+xml application/font-woff;
               # 注：woff2 本身已压缩，不列入（白耗 CPU）
    gzip_vary on;
    gzip_comp_level 5;
    # 预压缩静态资源（.gz 文件优先，省每请求 CPU）：部署后对 static 下
    # 大 JS/CSS 执行一次 `gzip -9 -k <file>` 生成 .gz（如 jit-viewer.min.js
    # 10MB → ~2MB，静态直出不消耗应用 CPU）。
    # 依赖 ngx_http_gzip_static_module（官方 Windows 包自带，自编译需 --with）
    gzip_static on;

    # ---- 化学仿真（离线 Ketcher）说明 ----
    # /chem-lab、/chem-lab/sketch 的 CSP 由 Flask 下发，已包含
    #   script-src ... 'unsafe-eval' 'wasm-unsafe-eval'
    #   worker-src 'self' blob: data:
    #   connect-src ... /static/chem-lab/
    # 若在本 Nginx 再声明 Content-Security-Policy，浏览器会同时执行两份策略，
    # 必须在 Nginx 的 CSP 中同步保留上述指令，否则 Ketcher 编辑器无法启动。
    # 不再需要放行任何第三方在线化学服务域名。
    # /static/ 直服时 gzip_static 会优先发送同名 .gz；升级后必须重新运行
    # tools/precompress_static.py --refresh-only，或直接使用安装包升级。

    # ---- 代理公共设置（所有 proxy_pass 块继承）----
    # 大文件上传/下载需流式透传，关闭代理缓冲
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # 代理密钥（与应用 deploy.conf 的 proxy_secret 完全一致）。
    # 应用设置了 proxy_secret 后，只有携带正确 X-Proxy-Secret 的请求才采信
    # X-Real-IP/X-Forwarded-For；本行未配置或值不一致时，账号轨迹/限流
    # 会把来源记成 127.0.0.1（Nginx 自身地址）。
    # 未启用应用侧 proxy_secret 时，保留本行也无副作用（应用会忽略）。
    proxy_set_header X-Proxy-Secret "请替换为与 deploy.conf 相同的随机串";

    # ============================================================
    # 私有上传目录 → 代理回应用（应用层鉴权/中和/CORS，禁止 Nginx 直服）
    # 用**大小写不敏感的正则 location**：Windows 文件系统大小写不敏感，
    # `/static/UPLOADS/...` 若只按小写前缀匹配会落入下方 /static/ 直服，
    # 完全绕过 Flask 鉴权（实测可匿名读私有文件）。
    # 作业提交 / 作业附件 / 分块上传 / 网盘 / 学生作品 / Python 答案
    location ~* ^/static/(submissions|homework|chunks|uploads)/ {
        proxy_pass http://127.0.0.1:5000;
    }

    # ============================================================
    # 其余公共静态资源 → Nginx 直接服务（bootstrap/css/js/fontawesome/
    # axios/pptist/question_img/highlight 等，均无鉴权需求）
    location /static/ {
        # 部署时替换为安装目录（不含尾斜杠）。必须用 root 而非 alias：
        # alias 不会被嵌套 location 继承（嵌套块继承的是 server 级 root），
        # 用 alias 时 js/css/字体等命中嵌套块的请求会按默认 html 目录解析
        # → 公共静态资源整体 404，且 nginx -t 不报错（经典陷阱）。
        # root 按"root + 完整 URI"拼路径，/static/ 前缀天然吻合。
        # 示例：root D:/ITstudy;
        root "C:/Program Files/ITstudy";
        add_header X-Content-Type-Options nosniff always;
        # 嵌套正则优先于外层正则，上传目录必须在本层再次优先代理。
        location ~* ^/static/(submissions|homework|chunks|uploads)/ {
            proxy_pass http://127.0.0.1:5000;
        }
        # .html 入口单独 no-cache（如 /static/pptist/index.html）：
        # 升级构建产物后哈希资源名变化，客户端若缓存旧入口页会引用
        # 已删除资源 → 白屏。必须放在通用扩展名 location 之前
        location ~* /static/.*\.html$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
        # 不可变资源（带 ?v= 版本参数）长缓存：versioned_static 给每个
        # 资源加版本参数，版本变化即换 URL，可安全 max-age=31536000,
        # immutable——此前 600s 让 jit-viewer.min.js（10MB）每次访问都
        # 重新校验；无版本参数的同名资源仍走下方兜底缓存。
        # 注意：if 分支内声明了 add_header 即不再继承外层头，
        # nosniff 必须在此重复声明
        location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ttf|eot|webp|ico|map)$ {
            if ($args ~* (^|&)v=) {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header X-Content-Type-Options nosniff always;
            }
            add_header Cache-Control "public, max-age=600" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # ============================================================
    # SSE（/api/events/<channel>：课堂大屏推送）：显式 HTTP/1.1 长连接
    # （默认 1.0 + close 语义每次事件后重建连接，长课堂下徒增开销）；
    # proxy_buffering off 已在 server 级生效，响应头 X-Accel-Buffering: no
    # 由应用设置双保险。AI 流式对话走 /api/ai/chat/stream，经下方 location /
    # 转发，同样依赖 server 级 proxy_buffering off 逐块下发（单次上限 180s）
    location /api/events/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 其余全部动态请求 → 应用
    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
